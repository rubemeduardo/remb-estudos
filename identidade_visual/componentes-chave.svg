  <text x="48" y="102" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#64748b">Referencia visual dos elementos recorrentes identificados na interface.</text>

  <rect x="48" y="144" width="220" height="398" rx="18" fill="#0f172a"/>
